<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>beamLab — IES Workbench</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>beamLab <small id="app-version"></small></h1>
        <p>IES Workbench: open, evaluate and manipulate photometric IES files.</p>
      </div>
      <nav class="header-actions" aria-label="Main actions">
        <label class="btn primary file-btn">
          Open IES files…
          <input id="file-input" type="file" accept=".ies,.IES" multiple />
        </label>
        <button id="report-btn" class="btn" type="button">Report</button>
        <button id="settings-export" class="btn" type="button">Export settings</button>
        <label class="btn file-btn">
          Import settings…
          <input id="settings-input" type="file" accept=".json,application/json" />
        </label>
        <button id="help-btn" class="btn" type="button">Help</button>
      </nav>
    </header>
    <div id="settings-notice" class="settings-notice" role="status" hidden></div>
    <main class="layout">
      <aside id="workspace" class="panel" aria-label="Workspace"></aside>
      <section id="viewer" class="panel viewer" aria-label="Viewer"></section>
      <aside id="taskpanel" class="panel" aria-label="Task panel"></aside>
    </main>
    <div id="drop-overlay" hidden><div>Drop IES files to load them</div></div>
    <footer>
      <p>© 2026 Jalib Akther. All rights reserved.</p>
      <p>Files are processed locally in your browser. Nothing is uploaded.</p>
    </footer>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
