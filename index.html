<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>beamLab — IES Workbench</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --fg: #1d1d1b;
        --muted: #6b6b66;
        --border: #b9b9b2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --fg: #ececea;
          --muted: #9a9a94;
          --border: #4a4a46;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      header, main, footer { padding: 16px; }
      header h1 { margin: 0; font-size: 1.4rem; }
      header p { margin: 4px 0 0; color: var(--muted); }
      main { flex: 1; display: flex; }
      .dropzone {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 240px;
        border: 2px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
        font-size: 1.1rem;
      }
      footer { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--border); }
      footer p { margin: 2px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>beamLab <small id="app-version"></small></h1>
      <p>IES Workbench: open, evaluate and manipulate photometric IES files.</p>
    </header>
    <main>
      <div class="dropzone" aria-label="IES file drop area (not yet functional)">Drop IES files here</div>
    </main>
    <footer>
      <p>© 2026 Jalib Akther. All rights reserved.</p>
      <p>Files are processed locally in your browser. Nothing is uploaded.</p>
    </footer>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
